name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl1-mesa-dev xvfb imagemagick xdotool
      - name: Core tests
        run: cargo +stable test --no-default-features
      - name: Build native application
        run: cargo +stable build
      - name: Inventory smoke test
        run: ./target/debug/scope --scan .
      - name: GUI startup and zoom smoke test
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -e -c '
            export LIBGL_ALWAYS_SOFTWARE=1 SCOPE_TRACE=1
            ./target/debug/scope . > gui.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 8
            kill -0 "$pid"
            import -window root scope-overview.png
            xdotool mousemove 600 420 click 1
            for step in $(seq 1 80); do
              xdotool click 4
              sleep 0.25
              kill -0 "$pid"
              if grep -Eq "scope source: .*runs=[1-9][0-9]* " gui.log; then break; fi
            done
            grep -Eq "scope source: .*runs=[1-9][0-9]* " gui.log
            sleep 2
            import -window root scope-zoom.png
            xdotool key Home
            sleep 1
            kill -0 "$pid"
          '
          cat gui.log
          ! grep -Ei 'panicked|error expanding|error applying|shader compilation failed' gui.log
      - name: Preserve smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-linux-smoke
          path: |
            gui.log
            scope-overview.png
            scope-zoom.png
            Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
