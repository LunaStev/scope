name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl1-mesa-dev xvfb imagemagick xdotool
      - name: Module tests and root boundaries
        run: |
          set -o pipefail
          mkdir -p evidence
          cargo +stable test --workspace 2>&1 | tee evidence/tests.log
          cargo +stable test -p scope --no-default-features
          python3 scripts/check_architecture.py
      - name: Native application and accounting
        run: |
          set -o pipefail
          cargo +stable build -p scope 2>&1 | tee evidence/build.log
          ./target/debug/scope --json . > /tmp/scope-inventory.json
          python3 scripts/check_report.py /tmp/scope-inventory.json
      - name: Complete image map and cached zoom
        run: |
          set -o pipefail
          bash scripts/gui_smoke.sh 2>&1 | tee evidence/gui-test.log
      - name: Complete-map and navigation benchmark
        run: |
          set -o pipefail
          before=$(mktemp -d /tmp/scope-reveal-before.XXXXXX)
          after=$(mktemp -d /tmp/scope-reveal-after.XXXXXX)
          git archive 1b9690cc1866315009a68e02f8364d7e85557eb8 | tar -x -C "$before"
          git archive HEAD | tar -x -C "$after"
          cp Cargo.lock "$before/Cargo.lock"
          cp Cargo.lock "$after/Cargo.lock"
          python3 scripts/prepare_reveal_benchmark.py "$before" "$after"
          # Resolve local workspace edges without asking metadata to download
          # source archives for unrelated Android/Windows targets.
          cargo +stable generate-lockfile --offline --manifest-path "$before/Cargo.toml"
          python3 - "$before/Cargo.lock" "$after/Cargo.lock" <<'PY'
          import sys,tomllib
          def packages(path):
              with open(path,'rb') as f: data=tomllib.load(f)
              return {(p['name'],p['version'],p.get('source')) for p in data['package'] if 'source' in p}
          baseline,current=map(packages,sys.argv[1:])
          assert baseline <= current, f'Unmatched baseline dependency versions: {baseline-current}'
          PY
          CARGO_TARGET_DIR="$before/target" cargo +stable build --locked --release --manifest-path "$before/Cargo.toml" -p scope 2>&1 | tee evidence/before-build.log
          CARGO_TARGET_DIR="$after/target" cargo +stable build --locked --release --manifest-path "$after/Cargo.toml" -p scope 2>&1 | tee evidence/after-build.log
          printf '%s' "$after/target/release/scope" > "$RUNNER_TEMP/scope-map-binary-path"
          xvfb-run -a -s '-screen 0 1600x1050x24' python3 scripts/reveal_benchmark.py "$before/target/release/scope" "$after/target/release/scope" 2>&1 | tee evidence/reveal-test.log
      - name: Large index and warm reuse benchmark
        run: |
          set -o pipefail
          cargo +stable build --release -p runtime --example large_index
          python3 scripts/large_fixture.py /tmp/scope-50m --files 20000 --lines 2500 > evidence/fixture-50m.json
          ./target/release/examples/large_index /tmp/scope-50m 20000 50000000 | tee evidence/index-50m.json
          python3 scripts/large_fixture.py /tmp/scope-100k --files 100000 --lines 100 > evidence/fixture-100k.json
          ./target/release/examples/large_index /tmp/scope-100k 100000 10000000 | tee evidence/index-100k.json
      - name: Fifty-million-line native map coverage
        run: |
          set -o pipefail
          binary=$(cat "$RUNNER_TEMP/scope-map-binary-path")
          xvfb-run -a -s '-screen 0 1600x1050x24' python3 scripts/map_scale_test.py "$binary" /tmp/scope-50m 50000000 2>&1 | tee evidence/map-scale-test.log
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p evidence
          cp /tmp/scope-inventory.json evidence/inventory.json 2>/dev/null || true
          git archive --format=tar HEAD > evidence/source.tar
          cp Cargo.lock evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scope-validation
          path: |
            evidence
            !evidence/map-cache
          retention-days: 7
