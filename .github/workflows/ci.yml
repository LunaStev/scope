name: Visual reference capture
on: [push]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect public video reference
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, urllib.request, pathlib
          url='https://api.fxtwitter.com/rikarends/status/2100295688881852508'
          try:
              req=urllib.request.Request(url, headers={'User-Agent':'Scope design reference/1.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  data=json.load(r)
              pathlib.Path('evidence/post.json').write_text(json.dumps(data,indent=2))
              videos=data.get('tweet',{}).get('media',{}).get('videos',[])
              if videos:
                  video=videos[0]['url']
                  assert video.startswith('https://video.twimg.com/')
                  with urllib.request.urlopen(video, timeout=45) as r:
                      payload=r.read(100*1024*1024+1)
                  assert len(payload)<=100*1024*1024
                  pathlib.Path('/tmp/reference.mp4').write_bytes(payload)
          except Exception as e:
              pathlib.Path('evidence/error.txt').write_text(str(e))
          PY
          if [ -f /tmp/reference.mp4 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffprobe -v quiet -show_format -of json /tmp/reference.mp4 > evidence/video.json
            ffmpeg -hide_banner -loglevel error -i /tmp/reference.mp4 -vf 'fps=1/4,scale=1600:-1' -frames:v 16 evidence/frame-%02d.jpg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: visual-reference
          path: evidence
          retention-days: 2
