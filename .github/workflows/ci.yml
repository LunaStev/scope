name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl1-mesa-dev xvfb imagemagick xdotool
      - name: Module tests
        run: |
          cargo +stable test --workspace
          cargo +stable test -p scope --no-default-features
      - name: Root module boundaries
        run: python3 scripts/check_architecture.py
      - name: Build native application
        run: cargo +stable build -p scope
      - name: Inventory accounting test
        run: |
          ./target/debug/scope --json . > /tmp/scope-inventory.json
          python3 scripts/check_report.py /tmp/scope-inventory.json
      - name: Continuous source and camera regression
        run: bash scripts/gui_smoke.sh
      - name: Preserve evidence
        if: always()
        run: |
          cp /tmp/scope-inventory.json inventory.json 2>/dev/null || true
          cp /tmp/scope-fixture.log gui.log 2>/dev/null || true
          cp /tmp/scope-before-zoom.log overview.log 2>/dev/null || true
          cp /tmp/scope-repository.log repository.log 2>/dev/null || true
          git archive --format=tar HEAD > source.tar
      - name: Upload validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-linux-smoke
          path: |
            gui.log
            overview.log
            repository.log
            scope-source-overview.png
            scope-source-read.png
            scope-overview.png
            inventory.json
            source.tar
            Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
