name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl1-mesa-dev xvfb imagemagick xdotool
      - name: Module tests and root boundaries
        run: |
          set -o pipefail
          mkdir -p evidence
          cargo +stable test --workspace 2>&1 | tee evidence/tests.log
          cargo +stable test -p scope --no-default-features
          python3 scripts/check_architecture.py
      - name: Native application and accounting
        run: |
          cargo +stable build -p scope
          ./target/debug/scope --json . > /tmp/scope-inventory.json
          python3 scripts/check_report.py /tmp/scope-inventory.json
      - name: Retained geometry and compact UI
        run: bash scripts/gui_smoke.sh
      - name: Large index and warm reuse benchmark
        run: |
          set -o pipefail
          cargo +stable build --release -p runtime --example large_index
          python3 scripts/large_fixture.py /tmp/scope-large-fixture
          ./target/release/examples/large_index /tmp/scope-large-fixture | tee evidence/large-index.json
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p evidence
          cp /tmp/scope-inventory.json evidence/inventory.json 2>/dev/null || true
          git archive --format=tar HEAD > evidence/source.tar
          cp Cargo.lock evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scope-validation
          path: evidence
          retention-days: 7
