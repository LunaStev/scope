[workspace]
members = ["app", "model", "analysis", "layout", "runtime", "render", "ui"]
default-members = ["app"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false
repository = "https://github.com/LunaStev/scope"

[workspace.dependencies]
model = { path = "model" }
analysis = { path = "analysis" }
layout = { path = "layout" }
runtime = { path = "runtime" }
render = { path = "render" }
ui = { path = "ui" }
makepad-widgets = "=1.0.0"
ignore = "0.4"
tokei = { version = "=12.1.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
